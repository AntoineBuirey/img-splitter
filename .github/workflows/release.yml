name: Build release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            asset: img-splitter-windows-x86_64.exe
          - platform: linux
            runner: ubuntu-latest
            asset: img-splitter-linux-x86_64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tk runtime
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\build.ps1

      - name: Build Linux executable
        if: matrix.platform == 'linux'
        shell: bash
        run: bash build.sh

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp dist/img-splitter.exe "release-assets/${{ matrix.asset }}"
          else
            cp dist/img-splitter "release-assets/${{ matrix.asset }}"
            chmod +x "release-assets/${{ matrix.asset }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-asset
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Add binaries to GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-release-asset"
          merge-multiple: true

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber --repo "${{ github.repository }}"
